# Her gonderide programi derler; "v" ile baslayan bir etiket (v2.1 gibi) gonderilince surumu yayinlar.
# Surum GitHub sitesindeki Releases > "Draft a new release" ile de yayinlanabilir; dosyalar o surume eklenir.
# Surum notlari surum-notlari.md dosyasindan alinir; program yeni surumu haber verirken bu notlari gosterir.
name: Derle ve yayınla

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

# Ayni surum icin iki calisma (etiket + yayin) ust uste binmesin
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write

jobs:
  derle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Sürüm numarasını denetle
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $surum = (Select-String -Path Ortak.cs -Pattern 'Surum = "([0-9.]+)"').Matches[0].Groups[1].Value
          if ("v$surum" -ne "${{ github.ref_name }}") {
            throw "Ortak.cs içindeki sürüm ($surum) etiketle (${{ github.ref_name }}) aynı değil."
          }

      - name: Derle
        shell: cmd
        run: derle.bat

      - name: Sürümü yayınla
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $etiket = "${{ github.ref_name }}"
          gh release view $etiket *> $null
          if ($LASTEXITCODE -eq 0) {
            # Surum sitede elle olusturulduysa dosyalar eklenir, baslik ve notlar duzeltilir
            gh release upload $etiket SurucuAraciKurulum.exe SurucuAraci.exe --clobber
            if ($LASTEXITCODE -ne 0) { throw "Dosyalar sürüme eklenemedi." }
            gh release edit $etiket --title "Sürücü Aracı $etiket" --notes-file surum-notlari.md
            if ($LASTEXITCODE -ne 0) { throw "Sürüm bilgileri düzeltilemedi." }
          } else {
            gh release create $etiket SurucuAraciKurulum.exe SurucuAraci.exe `
              --title "Sürücü Aracı $etiket" --notes-file surum-notlari.md
            if ($LASTEXITCODE -ne 0) { throw "Sürüm oluşturulamadı." }
          }
